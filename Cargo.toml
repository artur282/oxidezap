[package]
name = "oxidezap"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight, native WhatsApp Web desktop client for Linux, built with Rust and GPUI."
license = "MIT"
repository = "https://github.com/artur282/oxidezap"
homepage = "https://github.com/artur282/oxidezap"
documentation = "https://github.com/artur282/oxidezap#readme"
readme = "README.md"
keywords = ["whatsapp", "gpui", "linux", "desktop", "webkitgtk"]
categories = ["gui", "desktop"]
publish = false

[[bin]]
name = "oxidezap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
crossbeam-channel = "0.5"
directories = "6"
gdkx11 = "0.18"
glib = "0.18"
gpui = { version = "0.2.2", default-features = false, features = ["x11"] }
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
include_dir = "0.7"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "=0.2.180"
notify-rust = "4"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
x11rb = { version = "0.13", features = ["screensaver"] }
zbus = "5"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
