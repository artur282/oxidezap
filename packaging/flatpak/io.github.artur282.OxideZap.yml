# Flatpak manifest for OxideZap.
#
# The application id is used for the exported desktop entry, icon, AppStream
# metadata, and the whatsapp:// URL handler.
app-id: io.github.artur282.OxideZap
runtime: org.gnome.Platform
# GNOME 51 ships WebKitGTK 2.54.1. OxideZap requires WebKitGTK 2.46.1 or
# newer, because older releases can hang the WhatsApp Web QR login.
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: oxidezap

finish-args:
  # WhatsApp Web needs network access.
  - --share=network
  # OxideZap runs on X11/XWayland only. GPUI uses X11 and the WebKit overlay is
  # a transient X11 window.
  - --socket=x11
  # X11 MIT-SHM and the shared-memory buffers used by WebKitGTK.
  - --share=ipc
  # GPUI renders through Vulkan.
  - --device=dri
  # Automatic downloads are written to the real ~/Downloads. File pickers use
  # the XDG file chooser portal instead of a blanket home permission.
  - --filesystem=xdg-download
  # Native notifications use org.freedesktop.Notifications through the
  # filtered session bus.
  - --talk-name=org.freedesktop.Notifications
  # StatusNotifierItem registration. Flatpak puts the app in a private PID
  # namespace, so OxideZap is PID 2, and ksni's instance counter starts at 1.
  # The name is therefore stable across launches.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-1

modules:
  - name: oxidezap
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      # The build sandbox has no network by default. Cargo fetches the crates
      # pinned in Cargo.lock during the build. A Flathub submission should
      # replace this with vendored sources generated by flatpak-cargo-generator
      # and drop this build argument.
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/oxidezap/cargo
    build-commands:
      # Fail with a clear message instead of a Cargo link error when the
      # runtime's WebKitGTK is older than the supported minimum.
      - >-
        pkg-config --atleast-version=2.46.1 webkit2gtk-4.1 ||
        { echo "error: WebKitGTK in the GNOME runtime is older than 2.46.1" >&2; exit 1; }
      - cargo build --release --locked
      - install -Dm755 target/release/oxidezap /app/bin/oxidezap
      - >-
        install -Dm644 packaging/io.github.artur282.OxideZap.desktop
        /app/share/applications/io.github.artur282.OxideZap.desktop
      - >-
        install -Dm644 packaging/oxidezap.metainfo.xml
        /app/share/metainfo/io.github.artur282.OxideZap.metainfo.xml
      - >-
        install -Dm644 assets/oxidezap.svg
        /app/share/icons/hicolor/scalable/apps/io.github.artur282.OxideZap.svg
      - >-
        install -Dm644 assets/oxidezap-64.png
        /app/share/icons/hicolor/64x64/apps/io.github.artur282.OxideZap.png
      - >-
        install -Dm644 assets/oxidezap-128.png
        /app/share/icons/hicolor/128x128/apps/io.github.artur282.OxideZap.png
      - >-
        install -Dm644 assets/oxidezap-256.png
        /app/share/icons/hicolor/256x256/apps/io.github.artur282.OxideZap.png
      - >-
        install -Dm644 assets/oxidezap-512.png
        /app/share/icons/hicolor/512x512/apps/io.github.artur282.OxideZap.png
      - >-
        install -Dm644 LICENSE
        /app/share/licenses/io.github.artur282.OxideZap/LICENSE
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - dist
          - target
