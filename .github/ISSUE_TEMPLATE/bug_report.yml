name: Bug report
description: Report a reproducible defect
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, session tokens, phone numbers, or other
        personal data. Security issues belong in SECURITY.md, not here.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken, and since when?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OxideZap version or commit
      placeholder: v0.1.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - install.sh
        - Flatpak
        - AppImage
        - Built from source
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution, desktop, session type, and GPU driver
      placeholder: Linux Mint 22.3, Cinnamon, X11, Mesa 25.0
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, or a trace. Remove personal data first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues before opening this one.
          required: true
        - label: I removed session tokens, phone numbers, and other personal data.
          required: true
