name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache compiler artifacts
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: oxidezap
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake ninja-build mold \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libfreetype-dev libvulkan-dev libx11-dev libxcb1-dev \
            libwayland-dev libssl-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo nextest run

      - name: Build optimized binary (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo build --profile ci-release

  packaging:
    name: Validate packaging
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils python3-yaml

      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n packaging/appimage/AppRun
          bash -n packaging/appimage/build-appimage.sh
          bash -n packaging/flatpak/build-flatpak.sh

      - name: Validate desktop entries
        run: |
          desktop-file-validate packaging/oxidezap.desktop
          desktop-file-validate packaging/io.github.artur282.OxideZap.desktop

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net packaging/oxidezap.metainfo.xml

      - name: Validate YAML
        run: |
          python3 - <<'PY'
          import glob
          import yaml

          paths = glob.glob(".github/workflows/*.yml")
          paths.append("packaging/flatpak/io.github.artur282.OxideZap.yml")
          for path in paths:
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"parsed {path}")
          PY
