name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build release archive
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache compiler artifacts
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: oxidezap-release
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake ninja-build mold \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libfreetype-dev libvulkan-dev libx11-dev libxcb1-dev \
            libwayland-dev libssl-dev

      - name: Build release binary
        run: cargo build --release

      - name: Package release archive
        run: |
          set -eu
          name="oxidezap-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/${name}/packaging" "dist/${name}/assets"
          cp target/release/oxidezap "dist/${name}/oxidezap"
          cp README.md LICENSE install.sh "dist/${name}/"
          chmod +x "dist/${name}/oxidezap" "dist/${name}/install.sh"
          cp packaging/io.github.artur282.OxideZap.desktop \
            packaging/oxidezap.metainfo.xml "dist/${name}/packaging/"
          cp assets/oxidezap.svg assets/oxidezap-64.png assets/oxidezap-128.png \
            assets/oxidezap-256.png assets/oxidezap-512.png "dist/${name}/assets/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: dist/oxidezap-*.tar.gz
          if-no-files-found: error

  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak bundle
        env:
          INSTALL_DEPS_FROM_FLATHUB: "1"
          VERSION: ${{ github.ref_name }}
        run: packaging/flatpak/build-flatpak.sh --output-dir dist

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache compiler artifacts
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: oxidezap-release
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake ninja-build mold \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libfreetype-dev libvulkan-dev libx11-dev libxcb1-dev \
            libwayland-dev libssl-dev

      - name: Build AppImage
        env:
          VERSION: ${{ github.ref_name }}
        run: packaging/appimage/build-appimage.sh --output-dir dist

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [release, flatpak, appimage]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
